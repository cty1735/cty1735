    <text x="590" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="86" font-weight="800" letter-spacing="8" fill="url(#ink)">CTY</text>
    <text x="590" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#c9d5e3">把界面 <tspan fill="#22d3ee" font-weight="700">写清楚</tspan></text>
