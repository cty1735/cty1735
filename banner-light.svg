<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="260" viewBox="0 0 1180 260" role="img" aria-label="cty · 前端为主 · Node.js · TypeScript">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset="0.48" stop-color="#f3f0ff"/>
      <stop offset="1" stop-color="#fff2f8"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1522"/>
      <stop offset="0.55" stop-color="#1d2a55"/>
      <stop offset="1" stop-color="#4c5f9e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(9,105,218,.13)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="0" y="0" width="1180" height="260" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1180" height="260" fill="url(#bg)"/>
    <rect width="1180" height="260" fill="url(#grid)" opacity="0.7"/>
    <circle cx="180" cy="40" r="230" fill="url(#glowA)"/>
    <circle cx="1010" cy="230" r="260" fill="url(#glowB)"/>
    <text x="590" y="80" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="3" fill="#59636e">// FRONTEND-FIRST · NODE.JS · TYPESCRIPT</text>
    <text x="590" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="86" font-weight="800" letter-spacing="8" fill="url(#ink)">CTY</text>
    <text x="590" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#1f2328">把界面 <tspan fill="#0891b2" font-weight="700">做成</tspan> 作品</text>
  </g>
  <rect x="0.5" y="0.5" width="1179" height="259" rx="20" fill="none" stroke="#d1d9e0"/>
</svg>